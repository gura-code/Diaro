<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Diario</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2b2b2b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            flex-direction: column;
        }

        .book-container {
            perspective: 1500px;
        }

        .book {
            width: 400px; /* Larghezza iniziale da chiuso (copertina singola) */
            height: 550px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: width 0.6s ease;
        }

        /* Quando il libro è aperto, raddoppia la larghezza */
        .book.step-1 {
            width: 800px;
        }

        /* Pagine interne fisse */
        .spread {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            background-color: #e3dec3;
            z-index: 1;
        }

        .spread-left, .spread-right {
            width: 50%;
            height: 100%;
            background-size: cover;
            background-position: center;
        }

        .spread-left {
            /* Immagine della pagina di sinistra presa direttamente dalla chat */
            background-image: url('https://www.google.com/url?sa=i&url=https%3A%2F%2Fplaceholder.com&psig=AOvVaw0... (link diretto aggiornato)'); 
            border-right: 1px solid #d0c9a9;
        }

        .spread-right {
            /* Immagine della pagina di destra presa direttamente dalla chat */
        }

        /* Copertina che si sfoglia */
        .cover-page {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left;
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 10;
        }

        .cover-front, .cover-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
        }

        .cover-front {
            background-color: #3b2314;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.5);
            border-left: 5px solid #22130a;
        }

        .cover-back {
            background-color: #3b2314;
            transform: rotateY(180deg);
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.5);
        }

        /* Stati del libro */
        .book.step-0 .cover-page {
            transform: rotateY(0deg);
            z-index: 10;
            width: 100%;
            left: 0;
        }

        .book.step-1 .cover-page {
            transform: rotateY(-180deg);
            z-index: 0;
            width: 50%;
            left: 50%;
        }

        .book.step-2 .cover-page {
            transform: rotateY(-360deg);
            z-index: 10;
            width: 100%;
            left: 0;
        }

        .instruction {
            color: #bbb;
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="book step-0" id="myBook">
            
            <!-- Pagine interne fisse -->
            <div class="spread">
                <div class="spread-left" style="background-image: url('1000074960.png');"></div>
                <div class="spread-right" style="background-image: url('1000074706.png');" onclick="handleRightPageClick(event)"></div>
            </div>

            <!-- Copertina -->
            <div class="cover-page" onclick="handleCoverClick(event)">
                <div class="cover-front">
                    Il Mio Diario
                </div>
                <div class="cover-back"></div>
            </div>

        </div>
    </div>

    <div class="instruction">Clicca sul libro per aprirlo e chiuderlo</div>

    <script>
        let currentStep = 0;
        const book = document.getElementById('myBook');

        function handleCoverClick(event) {
            event.stopPropagation();
            if (currentStep === 0) {
                currentStep = 1;
                book.className = 'book step-1';
            } else if (currentStep === 2) {
                currentStep = 0;
                book.className = 'book step-0';
            }
        }

        function handleRightPageClick(event) {
            event.stopPropagation();
            if (currentStep === 1) {
                currentStep = 2;
                book.className = 'book step-2';
            }
        }
    </script>

</body>
</html>
