<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Diario</title>
    <style>
        /* Reset e impostazioni di base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Contenitore principale */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Stile della copertina del diario */
        .copertina {
            background-color: #3b2314;
            color: #d4af37; /* Colore dorato */
            width: 300px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px 8px 8px 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-left: 15px solid #27170c; /* Effetto rilegatura */
            user-select: none;
        }

        /* Contenitore delle pagine interne (inizialmente nascosto) */
        .pagine-aperte {
            display: none;
            gap: 0; /* Nessun spazio tra le pagine per simulare un libro aperto */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        /* Stile delle singole immagini delle pagine */
        .pagina {
            width: 350px;
            height: 500px;
            object-fit: cover;
            display: block;
        }

        /* Solo la pagina di destra deve essere cliccabile per chiudere */
        .pagina-destra {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Copertina del Diario -->
        <div id="copertina" class="copertina">
            Il Mio Diario
        </div>

        <!-- Pagine Aperte (Sinistra e Destra) -->
        <div id="pagineAperte" class="pagine-aperte">
            <img src="pagina-sinistra.png" alt="Pagina Sinistra" class="pagina">
            <img src="pagina-destra.png" alt="Pagina Destra" class="pagina pagina-destra" id="paginaDestra" title="Clicca per chiudere">
        </div>
    </div>

    <script>
        const copertina = document.getElementById('copertina');
        const pagineAperte = document.getElementById('pagineAperte');
        const paginaDestra = document.getElementById('paginaDestra');

        // Quando clicchi sulla copertina, questa scompare e appaiono le pagine
        copertina.addEventListener('click', function() {
            copertina.style.display = 'none';
            pagineAperte.style.display = 'flex';
        });

        // Quando clicchi specificamente sulla pagina di destra, il diario si chiude
        paginaDestra.addEventListener('click', function(event) {
            // Impedisce che il click si propaghi ad altri elementi
            event.stopPropagation();
            
            pagineAperte.style.display = 'none';
            copertina.style.display = 'flex';
        });
    </script>

</body>
</html>
