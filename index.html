<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Diario</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff; /* Sfondo bianco come richiesto */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            flex-direction: column;
        }

        .diary-container {
            width: 800px;
            height: 550px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background-color: #f9f8f4;
            border-radius: 4px;
        }

        /* Schermata della Copertina */
        .cover-view {
            width: 100%;
            height: 100%;
            background-color: #3b2314;
            color: #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
        }

        /* Schermata delle due pagine aperte */
        .pages-view {
            width: 100%;
            height: 100%;
            display: none; /* Nascosto all'inizio */
            background-color: #e3dec3;
        }

        .page-left, .page-right {
            width: 50%;
            height: 100%;
            overflow: hidden;
        }

        .page-left {
            border-right: 1px solid #d0c9a9;
        }

        .page-left img, .page-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .instruction {
            color: #666;
            margin-top: 20px;
            font-size: 14px;
            letter-spacing: 1px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="diary-container" id="diary" onclick="handleDiaryClick()">
        <!-- STATO 0: La Copertina Chiusa -->
        <div class="cover-view" id="coverView">
            Il Mio Diario
        </div>

        <!-- STATO 1: Le Due Pagine Aperte (Sinistra e Destra) -->
        <div class="pages-view" id="pagesView">
            <div class="page-left">
                <img src="pagina-sinistra.png" alt="Pagina Sinistra">
            </div>
            <div class="page-right" id="rightPage">
                <img src="pagina-destra.png" alt="Pagina Destra">
            </div>
        </div>
    </div>

    <div class="instruction" id="instructionText">Clicca sulla copertina per aprire il diario</div>

    <script>
        let currentState = 0; // 0 = Chiuso (Copertina), 1 = Aperto (Pagine)

        function handleDiaryClick(event) {
            const coverView = document.getElementById('coverView');
            const pagesView = document.getElementById('pagesView');
            const instructionText = document.getElementById('instructionText');

            if (currentState === 0) {
                // Passa da Chiuso ad Aperto
                coverView.style.display = 'none';
                pagesView.style.display = 'flex';
                instructionText.innerText = "Clicca sulla pagina di destra per chiudere il diario";
                currentState = 1;
            } else {
                // Se siamo aperti, controlliamo se il click è avvenuto sulla pagina di destra o sinistra
                // Vogliamo che si chiuda solo cliccando sulla pagina di destra
                if (event && event.target.closest('#rightPage')) {
                    pagesView.style.display = 'none';
                    coverView.style.display = 'flex';
                    instructionText.innerText = "Clicca sulla copertina per aprire il diario";
                    currentState = 0;
                }
            }
        }
    </script>

</body>
</html>
